<script type="module">
import * as THREE from '../lib/three.module.min.js';

const cargar=src=>new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; });

// ================= JUEGOS (atracción ↔ juego) =================
const J={
  'nochebuena-express':['Nochebuena Express','Don Carbón se robó los pedidos de Navidad. Vuela en la moto-trineo de Plázido y atínale a las chimeneas.','t_nochebuena'],

  'halloween':['La Cocina Embrujada','Atrapa a los amigos de Plázido y esquiva fantasmas, murciélagos y calabazas.','t_hw'],
  'navidad':['La Gran Entrega Navideña','Salta de azotea en azotea y entrega las pizzas de Nochebuena hasta el Zócalo.','t_nav'],
  'rosca':['¿Dónde está el muñeco?','Plázido esconde el muñeco en la rosca. Síguelo con la vista mientras revuelve los trozos.','t_rosca'],
  'loteria':['Lotería Plázido','Plázido canta las cartas. Pon tus frijolitos y grita ¡Lotería! antes de la carta 20.','t_lot'],
  'penales':['Penales con Plázido','Jalapeño se cree el mejor portero. Desliza el dedo y métele 3 de 5.','t_pen'],
  'memorama':['Memorama Plázido','Encuentra las parejas de los amigos de Plázido y de nuestras pizzas.','t_mem'],
  'pizza':['Arma tu Pizza','Sigue los pedidos, pon los ingredientes en orden y mete las pizzas al horno.','t_pizza'],
};
let ABIERTOS=null; // lista de la hoja "Juegos" (null = todos)

// ================= RENDER =================
const cv=$('gl');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(1.75,devicePixelRatio||1)); ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputColorSpace=THREE.SRGBColorSpace; ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.25;
const escena=new THREE.Scene(), cam=new THREE.PerspectiveCamera(50,1,.1,400);
let desp=0, despD=0; function desplazar(on){ despD=on?.24:0; }
function tamano(){ const w=innerWidth,h=innerHeight; ren.setSize(w,h,true); cam.aspect=w/h; cam.fov=w<h?62:46; cam.updateProjectionMatrix(); }
addEventListener('resize',tamano); tamano();
function lienzo(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=Math.min(8,ren.capabilities.getMaxAnisotropy()); return t; }
const CACHE={}, C=(k,f)=>CACHE[k]||(CACHE[k]=f());
const mat=o=>new THREE.MeshStandardMaterial(Object.assign({roughness:.7},o));
const glowT=lienzo(64,64,(g)=>{ const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.3,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); });
const foco=(color,s)=>{ const sp=new THREE.Sprite(C('gl'+color,()=>new THREE.SpriteMaterial({map:glowT,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}))); sp.scale.set(s,s,1); return sp; };
const rayas=(a,b,n=8,vert=false)=>lienzo(256,256,(g,w,h)=>{ for(let i=0;i<n;i++){ g.fillStyle=i%2?b:a; if(vert) g.fillRect(i*w/n,0,w/n,h); else g.fillRect(0,i*h/n,w,h/n); } });

escena.background=lienzo(4,512,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#05081E'); gr.addColorStop(.5,'#1B1A55'); gr.addColorStop(.8,'#5A2E7A'); gr.addColorStop(1,'#C2577A'); g.fillStyle=gr; g.fillRect(0,0,w,h); });
escena.fog=new THREE.Fog(0x2A1F5C,70,190);
escena.add(new THREE.HemisphereLight(0xC9C2FF,0x2E2440,1.0));
const luna=new THREE.DirectionalLight(0xD8E0FF,1.4); luna.position.set(-30,50,20); luna.castShadow=true; luna.shadow.mapSize.set(2048,2048);
Object.assign(luna.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:5,far:140}); luna.shadow.bias=-.0005; escena.add(luna);
const calida=[]; [[0,8,0],[-16,7,14],[16,7,14],[0,7,-18]].forEach(p=>{ const l=new THREE.PointLight(0xFFB868,60,40,1.6); l.position.set(...p); escena.add(l); calida.push(l); });

// ================= ATRACCIONES =================
const ATR=[]; const clicables=[]; const anim=[];
function letrero(texto,emoji,ancho=8){ const t=lienzo(512,160,(g,w,h)=>{ g.fillStyle='#422913'; g.beginPath(); g.roundRect(4,4,w-8,h-8,34); g.fill(); g.strokeStyle='#FCC10C'; g.lineWidth=8; g.beginPath(); g.roundRect(10,10,w-20,h-20,28); g.stroke();
    g.font='70px serif'; g.textAlign='left'; g.textBaseline='middle'; g.fillText(emoji,28,h/2+4); g.fillStyle='#FCC10C'; let fz=64; g.font=`900 ${fz}px "Bebas Neue",Impact,sans-serif`; const tw=g.measureText(texto).width, mw=w-150; if(tw>mw){ fz*=mw/tw; g.font=`900 ${fz}px "Bebas Neue",Impact,sans-serif`; } g.fillText(texto,120,h/2+4); });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false})); s.scale.set(ancho,ancho*160/512,1); s.renderOrder=5; return s; }
function atraccion(id,nombre,emoji,juegos,x,z,grupo,altoLetrero,radioCam=22,anchoL=8){
  grupo.position.set(x,0,z); escena.add(grupo); const l=letrero(nombre,emoji,anchoL); l.position.set(x,altoLetrero,z); escena.add(l);
  const a={id,nombre,emoji,juegos,grupo,letrero:l,pos:new THREE.Vector3(x,0,z),radioCam,altoL:altoLetrero};
  grupo.traverse(o=>{ if(o.isMesh){ o.userData.atr=a; clicables.push(o); } }); l.userData.atr=a; clicables.push(l); ATR.push(a); return a; }
const sombra=o=>{ o.traverse(m=>{ if(m.isMesh){ m.castShadow=true; m.receiveShadow=true; } }); return o; };

// 🎢 Montaña rusa nevada → Nochebuena Express
function montanaRusa(){ const g=new THREE.Group();
  const pts=[]; for(let i=0;i<64;i++){ const a=i/64*Math.PI*2; const r=9+Math.sin(a*3)*1.6; pts.push(new THREE.Vector3(Math.cos(a)*r*1.3,4+Math.sin(a*2)*3+Math.cos(a*5)*1.2+(i<10?3*Math.sin(i/10*Math.PI):0),Math.sin(a)*r*.8)); }
  const curva=new THREE.CatmullRomCurve3(pts,true); const rojo=mat({color:0xC8102E,roughness:.35,metalness:.4}), blanco=mat({color:0xF4F8FF,metalness:.3,roughness:.4});
  const N=new THREE.Vector3(); [-.35,.35].forEach(o=>{ const p2=curva.getSpacedPoints(300).map((p,i,arr)=>{ const t=curva.getTangentAt(i/300); N.set(-t.z,0,t.x).normalize(); return p.clone().addScaledVector(N,o); }); g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p2,true),300,.09,6,true),rojo)); });
  for(let i=0;i<40;i++){ const p=curva.getPointAt(i/40); const s=new THREE.Mesh(C('sopG',()=>new THREE.CylinderGeometry(.09,.12,1,6)),blanco); s.scale.y=p.y; s.position.set(p.x,p.y/2,p.z); g.add(s); if(i%2===0){ const b=foco([0xFF4D4D,0xFCC10C,0x6CE0FF][i%3],.9); b.position.copy(p).setY(p.y+.3); g.add(b); } }
  const tren=new THREE.Group(); const carros=[]; for(let i=0;i<4;i++){ const c=new THREE.Mesh(C('carG',()=>new THREE.BoxGeometry(.9,.55,1.2)),i%2?rojo:mat({color:0xFCC10C,metalness:.3,roughness:.4})); tren.add(c); carros.push(c); } g.add(tren);
  // nieve: montañitas blancas
  [[-5,-3,3],[4,2,2.4],[0,-5,2]].forEach(([x,z,r])=>{ const m=new THREE.Mesh(new THREE.ConeGeometry(r,r*1.4,10),mat({color:0xF4F8FF,roughness:.9})); m.position.set(x,r*.7,z); g.add(m); });
  anim.push(t=>{ carros.forEach((c,i)=>{ const u=(t*.07+i*.012)%1, p=curva.getPointAt(u), q=curva.getPointAt((u+.002)%1); c.position.copy(p).setY(p.y+.4); c.lookAt(q.x,q.y+.4,q.z); }); });
  return sombra(g); }
// 🎡 Rueda de la fortuna (mirador · ranking próximamente)
function rueda(){ const g=new THREE.Group(), rueda=new THREE.Group(); const blanco=mat({color:0xF4F8FF,metalness:.4,roughness:.35});
  [-.7,.7].forEach(z=>{ const t=new THREE.Mesh(new THREE.TorusGeometry(7,.13,8,64),blanco); t.position.z=z; rueda.add(t); });
  const cols=[0xC8102E,0xFCC10C,0x1E8A3A,0x2B6CD9,0xFF7A1A,0xE4007C];
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; const r=new THREE.Mesh(C('rayoG',()=>new THREE.CylinderGeometry(.06,.06,7,6)),blanco); r.position.set(Math.cos(a)*3.5,Math.sin(a)*3.5,0); r.rotation.z=a+Math.PI/2; rueda.add(r);
    const gon=new THREE.Mesh(C('gonG',()=>new THREE.BoxGeometry(1.2,1,1.2)),C('gm'+i%6,()=>mat({color:cols[i%6],roughness:.4}))); gon.userData.gon=true; gon.position.set(Math.cos(a)*7,Math.sin(a)*7-.6,0); rueda.add(gon); }
  for(let i=0;i<36;i++){ const a=i/36*Math.PI*2, b=foco([0xFCC10C,0xFF4D4D,0x6CE0FF][i%3],.7); b.position.set(Math.cos(a)*7.2,Math.sin(a)*7.2,.9); rueda.add(b); }
  const eje=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,2,12),mat({color:0xFCC10C,metalness:.6,roughness:.3})); eje.rotation.x=Math.PI/2; rueda.add(eje);
  rueda.position.y=8.2; g.add(rueda);
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([s,z])=>{ const p=new THREE.Mesh(C('pataG',()=>new THREE.CylinderGeometry(.15,.2,9,8)),blanco); p.position.set(s*1.9,4.1,z*1.1); p.rotation.z=-s*.24; g.add(p); });
  anim.push(t=>{ rueda.rotation.z=t*.15; rueda.children.forEach(c=>{ if(c.userData.gon) c.rotation.z=-rueda.rotation.z; }); });
  return sombra(g); }
// ⚽ Mini estadio → Penales 3D / Penales
function estadio(){ const g=new THREE.Group();
  const cancha=new THREE.Mesh(new THREE.PlaneGeometry(9,6),new THREE.MeshStandardMaterial({map:lienzo(256,170,(c,w,h)=>{ for(let i=0;i<8;i++){ c.fillStyle=i%2?'#2E8B3E':'#38A048'; c.fillRect(i*w/8,0,w/8,h); } c.strokeStyle='#fff'; c.lineWidth=3; c.strokeRect(6,6,w-12,h-12); c.beginPath(); c.moveTo(w/2,6); c.lineTo(w/2,h-6); c.stroke(); c.beginPath(); c.arc(w/2,h/2,22,0,7); c.stroke(); c.strokeRect(6,h/2-34,30,68); c.strokeRect(w-36,h/2-34,30,68); }),roughness:.9}));
  cancha.rotation.x=-Math.PI/2; cancha.position.y=.05; g.add(cancha);
  const gris=mat({color:0x5A6378}); const cols=[0xFCC10C,0xC8102E,0xFFFFFF,0x1E8A3A];
  [[0,-4.4,10,0],[0,4.4,10,Math.PI],[-5.9,0,7,Math.PI/2],[5.9,0,7,-Math.PI/2]].forEach(([x,z,w,r])=>{ const gr=new THREE.Group(); for(let i=0;i<3;i++){ const e=new THREE.Mesh(new THREE.BoxGeometry(w,.5,.8),gris); e.position.set(0,.25+i*.5,-i*.8); gr.add(e);
