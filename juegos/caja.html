<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pizzas Plaza · Caja · Validar cupón</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#FFF8E7;font-family:Nunito,system-ui,sans-serif;color:#422913;display:flex;flex-direction:column;align-items:center;padding:18px;gap:12px}
.logo{width:220px;background:#fff;border-radius:12px;padding:6px 10px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:44px;margin:0;color:#C8102E}
.box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(66,41,19,.12);display:flex;flex-direction:column;gap:10px}
label{font-weight:900;font-size:14px;display:flex;flex-direction:column;gap:4px}
input{font-family:Nunito,sans-serif;font-weight:900;font-size:24px;border:3px solid #422913;border-radius:12px;padding:8px 12px;text-align:center;letter-spacing:2px}
#cod{text-transform:uppercase;font-size:28px}
button{font-family:Nunito,sans-serif;font-weight:900;font-size:20px;border:0;border-radius:14px;padding:12px;color:#fff;background:#C8102E;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
button.verde{background:#16A34A}
button:disabled{opacity:.5}
#res{display:none}
.estado{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;text-align:center;border-radius:12px;color:#fff;padding:4px}
.ACTIVO{background:#16A34A}.CANJEADO{background:#B91C1C}.VENCIDO{background:#92400E}.NOEXISTE{background:#555}
.datos{font-weight:800;font-size:15px;line-height:1.6}
.TODAVÍA{background:#2563EB}
.pas{display:flex;gap:12px;align-items:center;border-top:2px dashed #E6D7B5;padding-top:10px}.pas canvas{width:110px;flex:none}.pas div{font-weight:800;font-size:14px}
.premio{display:none;background:#FFF3C4;border:3px solid #FCC10C;border-radius:14px;padding:10px;text-align:center;font-weight:900}
.msg{font-weight:900;text-align:center;min-height:22px}
small{opacity:.7;font-weight:700;text-align:center}
</style>
</head>
<body>
<img class="logo" src="img/logo.png" alt="Pizzas Plaza">
<h1>Caja · Cupones</h1>
<div class="box">
  <label>Código del cupón <span style="font-weight:700;opacity:.7">o celular del cliente</span><input id="cod" placeholder="PP-XXX-XXXX o 55 1234 5678" maxlength="14" autocomplete="off"></label>
  <button id="bVal">VALIDAR</button>
  <div class="msg" id="msg"></div>
</div>
<div class="box" id="res">
  <div class="estado" id="estado"></div>
  <div class="datos" id="datos"></div>
  <div id="zonaCanje">
    <label id="telConfBox" style="display:none">Celular del cliente (para confirmar)<input id="telConf" type="tel" inputmode="numeric" maxlength="10" placeholder="10 dígitos"></label>
    <label>PIN de tu sucursal<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
    <button class="verde" id="bCanjear" style="width:100%;margin-top:8px">APLICAR DESCUENTO Y CANJEAR</button>
  </div>
  <div class="msg" id="msg2"></div>
  <div class="pas" id="pas" style="display:none"><canvas id="pasCv"></canvas><div id="pasTxt"></div></div>
  <div class="premio" id="premio">🍕 ¡A ESTE CLIENTE LE TOCA UNA PIZZA MEDIANA GRATIS!<br><span style="font-weight:700;font-size:13px">Usa el mismo PIN de arriba.</span><br>
    <button class="verde" id="bPremio" style="width:100%;margin-top:8px">ENTREGAR PIZZA GRATIS</button></div>
</div>
<small>Cada cupón se puede canjear una sola vez en cualquier sucursal. Registra el código también en el ticket del POS.</small>
<script src="config.js"></script>
<script src="pasaporte.js"></script>
<script>
const $=id=>document.getElementById(id);
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
async function api(p){ const r=await fetch(PP_API+'?'+new URLSearchParams(p),{redirect:'follow'}); return r.json(); }
$('cod').addEventListener('input',e=>{ let raw=e.target.value.toUpperCase(); if(/^[\d\s]+$/.test(raw)) { e.target.value=raw.replace(/\D/g,'').slice(0,10); return; } let v=raw.replace(/[^A-Z0-9]/g,''); if(v.startsWith('PP')) v=v.slice(2); v=v.slice(0,7); e.target.value=v?'PP-'+v.slice(0,3)+(v.length>3?'-'+v.slice(3):''):''; });
let codigo='', telCli='';
function verPas(ps,animar){ if(!ps){ $('pas').style.display='none'; $('premio').style.display='none'; return; } $('pas').style.display='flex'; PASAPORTE.pintar($('pasCv'),ps.rebanadas,'./',animar);
  $('pasTxt').innerHTML=`Pasaporte: <b>${ps.rebanadas} de 8</b> rebanadas<br><span style="font-weight:700;opacity:.75">${ps.total} cupones canjeados en total</span>`; $('premio').style.display=ps.pizzasListas>0?'block':'none'; }
$('bPremio').onclick=async()=>{ if(!telCli) return; $('bPremio').disabled=true; $('msg2').textContent='Registrando…';
  try{ const r=await api({accion:'premio',tel:telCli,pin:$('pin').value}); if(r.ok){ $('msg2').textContent='✅ Pizza mediana gratis entregada en '+r.sucursal+'. El pasaporte vuelve a empezar.'; verPas(r.pasaporte,false); } else $('msg2').textContent=r.error; }
  catch(e){ $('msg2').textContent='Sin conexión. Intenta otra vez.'; } $('bPremio').disabled=false; };
$('bVal').onclick=async()=>{
  const val=$('cod').value.trim().toUpperCase(); const esTel=/^\d{10}$/.test(val);
  if(!esTel && val.length<11){ $('msg').textContent='Escribe el código completo o los 10 dígitos del celular.'; return; }
  $('msg').textContent='Consultando…'; $('bVal').disabled=true; $('res').style.display='none';
  try{ const r=await api(esTel?{accion:'validar',tel:val}:{accion:'validar',codigo:val}); $('msg').textContent=''; codigo=r.codigo||val; telCli=r.telCompleto||(esTel?val:''); $('telConfBox').style.display=esTel?'none':''; $('telConf').value=''; window._esTel=esTel; verPas(r.pasaporte,false);
    $('zonaCanje').style.display='';
    $('res').style.display='flex'; $('msg2').textContent='';
    if(!r.existe){ $('estado').className='estado NOEXISTE'; $('estado').textContent='NO EXISTE'; $('datos').textContent=esTel?'Este celular no tiene cupones. No aplicar descuento.':'Este código no está en el sistema. No aplicar descuento.'; $('zonaCanje').style.display=(r.pasaporte&&r.pasaporte.pizzasListas>0)?'':'none'; $('bCanjear').style.display='none'; }
    else { $('estado').className='estado '+r.estado; $('estado').textContent=r.estado==='ACTIVO'?'✓ VÁLIDO':r.estado;
      if(r.estado==='TODAVÍA NO') r.estado='TODAVÍA'; $('estado').className='estado '+r.estado; $('estado').textContent=r.estado==='ACTIVO'?'✓ VÁLIDO':r.estado==='TODAVÍA'?'🔒 TODAVÍA NO':r.estado;
      const pr=r.premio||{texto:'15% de descuento',emoji:'🍕'};
      $('datos').innerHTML=`<div style="font-size:22px;font-weight:900;background:#FFF3C4;border-radius:10px;padding:6px 10px;margin-bottom:6px">${pr.emoji||'🎁'} ${pr.texto}</div>${r.estado==='TODAVÍA'?'<b>Este cupón se puede usar a partir del '+r.desde+'.</b> No aplicar descuento hoy.<br>':''}Código: <b>${r.codigo}</b><br>Cliente: <b>${r.nombre||'—'}</b> (${r.tel})${esTel?' — <b>pregúntale su nombre para confirmar</b>':''}<br>Juego: ${r.juego}<br>Emitido: ${r.emitido}<br>Vence: ${r.vence}`+(r.canjeado?`<br><b>Canjeado: ${r.canjeado}${r.sucCanje?' en '+r.sucCanje:''}</b>`:'');
      const premio=r.pasaporte&&r.pasaporte.pizzasListas>0; $('zonaCanje').style.display=(r.estado==='ACTIVO'||premio)?'':'none'; $('bCanjear').style.display=r.estado==='ACTIVO'?'':'none'; }
  }catch(e){ $('msg').textContent='Sin conexión. Intenta otra vez.'; }
  $('bVal').disabled=false;
};
$('bCanjear').onclick=async()=>{
  $('bCanjear').disabled=true; $('msg2').textContent='Canjeando…';
  const telUsar=window._esTel?telCli:$('telConf').value.replace(/\D/g,'');
  if(!window._esTel && telUsar.length!==10){ $('msg2').textContent='Pídele al cliente su celular (10 dígitos) para confirmar.'; $('bCanjear').disabled=false; return; }
  try{ const r=await api({accion:'canjear',codigo,tel:telUsar,pin:$('pin').value});
    if(r.ok){ $('estado').className='estado CANJEADO'; $('estado').textContent='CANJEADO ✓'; $('bCanjear').style.display='none'; $('msg2').textContent=`Listo: aplica ${r.premio?r.premio.texto:r.descuento+'% de descuento'}. Canjeado el ${r.canjeado} en ${r.sucursal}. +1 rebanada 🍕`; verPas(r.pasaporte,true); }
    else $('msg2').textContent=r.error;
  }catch(e){ $('msg2').textContent='Sin conexión. Intenta otra vez.'; }
  $('bCanjear').disabled=false;
};
</script>
</body>
</html>
