<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pizzas Plaza · ¿Dónde está el muñeco?</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>

:root{--ppAcento:#7B2CBF;--oro:#FCC10C;--cafe:#422913}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--cafe);
  background:radial-gradient(circle at 50% 0%,#FFE9A8 0%,#F7C35F 45%,#C9762B 100%)}
.pantalla{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:16px}
.pantalla.on{display:flex}
.logoBox{background:#FFF8E7;border-radius:12px;padding:6px 10px;box-shadow:0 4px 0 rgba(66,41,19,.2)}
.logo{width:56vw;max-width:230px;display:block}
.tit{font-family:'Bebas Neue',Impact,sans-serif;font-size:54px;line-height:.95;margin:0;color:#4A1D6E;text-shadow:0 3px 0 #FCC10C}
.txt{font-weight:800;font-size:16px;max-width:340px;margin:0;line-height:1.35}
.premio{background:#4A1D6E;color:var(--oro);border-radius:14px;padding:10px 16px;font-weight:900;font-size:16px;max-width:340px}
.btn{font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;letter-spacing:1px;border:0;border-radius:16px;padding:10px 40px;background:#7B2CBF;color:#fff;box-shadow:0 6px 0 #4A1D6E;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4A1D6E}
.chico{font-size:13px;font-weight:700;opacity:.75;margin:0}
.plaz{height:120px;animation:flota 2.4s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px) rotate(-3deg)}}
/* juego */
#juego{justify-content:flex-start;padding-top:12px}
.hud{width:100%;max-width:460px;display:flex;justify-content:space-between;gap:8px}
.chip{background:rgba(74,29,110,.9);color:#fff;border-radius:12px;padding:4px 12px;font-weight:900;font-size:17px}
.host{display:flex;align-items:flex-end;gap:6px;width:100%;max-width:460px;min-height:120px}
.host img{height:110px;flex:none;transition:transform .2s}
.globo{background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;font-size:16px;text-align:left;position:relative;flex:1;margin-bottom:40px;box-shadow:0 4px 0 rgba(66,41,19,.15)}
.globo:before{content:'';position:absolute;left:-10px;bottom:12px;border:10px solid transparent;border-right-color:#fff;border-left:0}
#mesa{position:relative;width:min(94vw,460px);flex:1;max-height:420px;margin-top:6px}
.rosca{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:100%;opacity:.95}
.trozo{position:absolute;top:0;left:0;cursor:pointer;will-change:transform}
.trozo svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 4px rgba(66,41,19,.35))}
.trozo.elegible{animation:resalta 1s ease-in-out infinite}
@keyframes resalta{50%{filter:brightness(1.12)}}
.mantel{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;color:#4A1D6E;letter-spacing:1px;line-height:1}
.mantel small{display:block;font-size:16px;color:#7A4A12}
.mu{position:absolute;pointer-events:none;transition:opacity .2s}
.mano{position:absolute;font-size:34px;pointer-events:none;animation:apunta .8s ease-in-out infinite}
@keyframes apunta{50%{transform:translateY(-8px)}}
#mute{position:fixed;bottom:12px;right:12px;z-index:5;background:rgba(74,29,110,.85);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
.confeti{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:caer linear forwards;z-index:40}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
</style>
<link rel="stylesheet" href="../pp.css">
</head>
<body>

<section id="inicio" class="pantalla on">
  <div class="logoBox"><img class="logo" data-a="logo" alt="Pizzas Plaza"></div>
  <h1 class="tit">¿Dónde está<br>el muñeco?</h1>
  <img class="plaz" data-a="saludando" alt="Plázido">
  <p class="txt">¡Plázido escondió el muñeco en la rosca! Míralo bien, sigue el trozo cuando los revuelva y toca el que lo tiene.</p>
  <div class="premio">👑 Encuéntralo en las 3 rondas y gana <span class="vPct"></span>% de descuento</div>
  <button class="btn" id="bJugar">JUGAR</button>
  <p class="chico">Tienes 2 oportunidades. Cada ronda es más rápida.</p>
</section>

<section id="juego" class="pantalla">
  <div class="hud"><div class="chip" id="hRonda">Ronda 1/3</div><div class="chip" id="hVidas">❤️❤️</div></div>
  <div class="host"><img id="hostImg" data-a="pose_2" alt=""><div class="globo" id="globo"></div></div>
  <div id="mesa"></div>
</section>

<section id="fin" class="pantalla">
  <h1 class="tit">¡Se te escapó!</h1>
  <img class="plaz" data-a="pose_3" alt="">
  <p class="txt" id="finTxt"></p>
  <button class="btn" id="bOtra">OTRA VEZ</button>
</section>

  <circle cx="16.5" cy="15" r="1.4" fill="#555"/><circle cx="23.5" cy="15" r="1.4" fill="#555"/>
  <path d="M16 20 Q20 23 24 20" stroke="#E08A8A" stroke-width="1.6" fill="none"/>
  <path d="M4 30 Q10 34 12 30 M36 30 Q30 34 28 30" stroke="#C9C9C9" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const SVG_ROSCA=`<svg viewBox="0 0 400 200"><ellipse cx="200" cy="100" rx="196" ry="92" fill="#C9762B" stroke="#8E4A12" stroke-width="5"/>
  <ellipse cx="200" cy="100" rx="120" ry="44" fill="#F3D39A" stroke="#8E4A12" stroke-width="4"/>
  ${[...Array(10)].map((_,i)=>{const a=i/10*Math.PI*2,x=200+Math.cos(a)*158,y=100+Math.sin(a)*68;return `<rect x="${x-16}" y="${y-5}" width="32" height="10" rx="5" fill="${['#C8102E','#2E9D4A','#F2A900'][i%3]}" transform="rotate(${a*57.3+90} ${x} ${y})"/>`}).join('')}
  ${[...Array(8)].map((_,i)=>{const a=(i+.5)/8*Math.PI*2,x=200+Math.cos(a)*150,y=100+Math.sin(a)*62;return `<ellipse cx="${x}" cy="${y}" rx="18" ry="9" fill="#FFF6E6" opacity=".9"/>`}).join('')}</svg>`;

// ---------- estado ----------
let ronda=0, vidas=2, trozos=[], conMu=0, ocupado=true, W=0, tw=0;
const mesa=$('mesa');
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function decir(t,pose){ $('globo').textContent=t; if(pose) $('hostImg').src=A[pose]; }
function hud(){ $('hRonda').textContent=`Ronda ${ronda+1}/3`; $('hVidas').textContent='❤️'.repeat(vidas)+'🖤'.repeat(2-vidas); }

function slotX(s,n){ return (W-tw*n)/(n+1)*(s+1)+tw*s; }
function montar(){
  const R=RONDAS[ronda]; mesa.innerHTML=`<div class="rosca">${SVG_ROSCA}</div><div class="mantel">Rosca de Reyes · Pizzas Plaza<small>Hechas en serio, no en serie</small></div>`;
  W=mesa.clientWidth; tw=Math.min(118,(W-20)/(R.n+.35)); const H=mesa.clientHeight;
  const y=Math.min(H*.58,H-tw*.9)-tw*.35;
  trozos=[];
  for(let i=0;i<R.n;i++){
    const el=document.createElement('div'); el.className='trozo'; el.style.width=tw+'px'; el.innerHTML=svgTrozo(i);
    const t={el,slot:i,x:slotX(i,R.n),y}; el.style.transform=`translate(${t.x}px,${y}px)`;
    el.addEventListener('pointerdown',e=>{e.preventDefault(); elegir(t);}); mesa.appendChild(el); trozos.push(t);
  }
  const mu=document.createElement('div'); mu.className='mu'; mu.id='mu'; mu.innerHTML=SVG_MU; mu.style.width=(tw*.42)+'px'; mesa.insertBefore(mu,trozos[0].el); mu.style.opacity=0;
}
function ponerMu(t){ const mu=$('mu'); mu.style.left=(t.x+tw*.29)+'px'; mu.style.top=(t.y+tw*.2)+'px'; }
async function levantar(t,ms=380,alto=.75){
  const a=t.el.animate([{transform:`translate(${t.x}px,${t.y}px)`},{transform:`translate(${t.x}px,${t.y-tw*alto}px) rotate(-8deg)`}],{duration:ms,fill:'forwards',easing:'ease-out'});
  await a.finished;
}
async function bajar(t,ms=320){
  const a=t.el.animate([{transform:`translate(${t.x}px,${t.y-tw*.75}px) rotate(-8deg)`},{transform:`translate(${t.x}px,${t.y}px)`}],{duration:ms,fill:'forwards',easing:'ease-in'});
  await a.finished;
}
async function intercambiar(a,b,ms){
  const R=RONDAS[ronda], xa=a.x, xb=b.x, alto=tw*.32;
  const k=(x0,x1,dy)=>[{transform:`translate(${x0}px,${a.y}px)`},{transform:`translate(${(x0+x1)/2}px,${a.y+dy}px)`},{transform:`translate(${x1}px,${a.y}px)`}];
  a.el.style.zIndex=3; b.el.style.zIndex=1;
  const p1=a.el.animate(k(xa,xb,-alto),{duration:ms,fill:'forwards',easing:'ease-in-out'});
  const p2=b.el.animate(k(xb,xa,alto*.5),{duration:ms,fill:'forwards',easing:'ease-in-out'});
  SND.t(300+Math.random()*120,.05,'triangle',.03);
  await Promise.all([p1.finished,p2.finished]);
  [a.slot,b.slot]=[b.slot,a.slot]; a.x=xb; b.x=xa; a.el.style.zIndex=b.el.style.zIndex=2;
}

async function jugarRonda(){
  const R=RONDAS[ronda]; hud(); ocupado=true; montar();
  conMu=Math.floor(Math.random()*R.n); const t=trozos[conMu];
  decir(ronda===0?'¡Mira bien! Aquí escondo el muñeco…':ronda===1?'Ahora con 4 trozos. ¡No parpadees!':'Última ronda… ¡y voy rapidísimo!','pose_1');
  await espera(700); ponerMu(t); await levantar(t); $('mu').style.opacity=1; SND.ok(); await espera(1100);
  await bajar(t); $('mu').style.opacity=0; await espera(300);
  decir('¡Revolviendo! 🔄','feliz');
  let prev=null;
  for(let i=0;i<R.swaps;i++){
    let a,b; do{ a=trozos[Math.floor(Math.random()*R.n)]; b=trozos[Math.floor(Math.random()*R.n)]; }while(a===b || (prev && ((a===prev[0]&&b===prev[1])||(a===prev[1]&&b===prev[0]))) );
    // en rondas avanzadas, más intercambios incluyen el trozo con muñeco
    if(ronda>0 && Math.random()<.45 && a!==trozos[conMu] && b!==trozos[conMu]) a=trozos[conMu];
    if(a===b) continue;
    prev=[a,b]; await intercambiar(a,b,R.ms*(i===R.swaps-1?1.2:1));
  }
  decir('¿Dónde quedó el muñeco? ¡Toca un trozo!','pose_2');
  trozos.forEach(x=>x.el.classList.add('elegible')); ocupado=false;
}

async function elegir(t){
  if(ocupado) return; ocupado=true; SND.on(); SND.click();
  trozos.forEach(x=>x.el.classList.remove('elegible'));
  const ok=t===trozos[conMu]; const real=trozos[conMu];
  ponerMu(real);
  await levantar(t);
  if(ok){ $('mu').style.opacity=1; SND.bien(); vib([20,30,20]); decir(FRASES_OK[ronda],'feliz'); await espera(1300);
    ronda++; if(ronda>=RONDAS.length) return ganar(); decir(CHISTES[ronda-1],'pose_4'); await espera(1900); jugarRonda(); }
  else{ SND.mal(); vib(120); vidas--; hud(); decir('¡Uy! No estaba ahí… ¡mira, estaba aquí!','pose_3'); await espera(500);
    $('mu').style.opacity=1; await levantar(real); await espera(1300);
    if(vidas<=0) return perder(); decir('Te queda una oportunidad. ¡Repetimos la ronda!','pose_2'); await espera(1500); jugarRonda(); }
}

function mostrar(id){ document.querySelectorAll('.pantalla').forEach(s=>s.classList.toggle('on',s.id===id)); }
function empezar(){ SND.on(); ronda=0; vidas=2; mostrar('juego'); setTimeout(jugarRonda,50); }
function ganar(){ SND.gana(); confeti(); setTimeout(()=>PP.ganar(),900); }
function perder(){ SND.pierde(); $('finTxt').textContent=`Llegaste a la ronda ${ronda+1} de 3. ¡Inténtalo de nuevo, el muñeco no puede esconderse para siempre!`; mostrar('fin'); }
function confeti(){ const c=['#7B2CBF','#FCC10C','#C8102E','#2E9D4A','#fff']; for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='confeti';
  d.style.left=Math.random()*100+'vw'; d.style.background=c[i%5]; d.style.animationDuration=(1.8+Math.random()*1.8)+'s'; d.style.animationDelay=Math.random()*.5+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),4200);} }

$('bJugar').onclick=empezar; $('bOtra').onclick=empezar;
PP.init({protegidos:['bJugar','bOtra'],clave:'rosca',titulo:'¡Encontraste el muñeco!',mensaje:'Plázido te regala tu descuento… ¡y el que saca el muñeco invita la pizza!',logo:A.logo,img:A.saludando,alRejugar:empezar});
</script>
